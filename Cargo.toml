[workspace]
resolver = "2"
members = ["crates/prumo-core", "crates/prumo-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "macros", "local-offset"] }
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
