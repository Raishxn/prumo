when = "Instalação limpa sem o recurso em uso."
change = "Serviços DiagTrack e dmwappushservice desativados (Start=4); política AllowTelemetry=1."
benefit = "Menos serviços e atividade em segundo plano. Ganho não medido."
side_effects = "Nenhum recurso de uso comum depende deles; o relatório de diagnóstico da Microsoft fica mínimo."
undo = "Desfazer restaura o valor anterior real de cada chave; serviços voltam após reiniciar."
validation = "Contar processos e serviços antes e depois; testar Valorant, Broadcast, Chrome e impressão."
