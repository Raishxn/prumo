version = 1
title = "Desligar a telemetria do Windows"
platform = "windows"
area = "Processos"
tier = "recommended"
evidence = "hypothesis"
privilege = "admin"
restart = "reboot"
problem = "Connected User Experiences (DiagTrack) e o roteamento WAP ficam ativos coletando e enviando dados."
