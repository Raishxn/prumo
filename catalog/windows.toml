url = "https://vain.zone"
consulted = "2026-11-02"
says = "Lista os mesmos serviços/chaves; lido localmente, sem validação independente."
[[action.steps]]
kind = "reg_set"
path = "HKLM\\SYSTEM\\CurrentControlSet\\Services\\DiagTrack"
name = "Start"
value_type = "REG_DWORD"
data = "4"
[[action.steps]]
kind = "reg_set"
path = "HKLM\\SYSTEM\\CurrentControlSet\\Services\\dmwappushservice"
name = "Start"
value_type = "REG_DWORD"
data = "4"
[[action.steps]]
kind = "reg_set"
path = "HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\DataCollection"
name = "AllowTelemetry"
value_type = "REG_DWORD"
data = "1"

