# Catálogo de ações — CachyOS / Linux.
# Cada ação documenta os 10 itens exigidos (problem, compat, when, change,
# benefit, side_effects, privilege/restart, undo, validation, sources).
# Benefícios nunca trazem percentuais. "evidence" segue a classificação do
# projeto; documentação de funcionamento NÃO é prova de ganho.

[[action]]
id = "linux.nvidia.glcache-tamanho"
version = 1
title = "Aumentar o limite do cache de shaders OpenGL da NVIDIA"
platform = "linux"
area = "Minecraft"
tier = "recommended"
evidence = "official_doc"
privilege = "user"
restart = "logout"
problem = "Shaders compilados pelo driver ficam em ~/.cache/nvidia/GLCache. Quando o cache atinge o limite de tamanho, entradas antigas são descartadas e precisam ser recompiladas, o que pode aparecer como engasgo ao ver blocos/efeitos novos (Minecraft com shaders é o caso típico)."
compat = "Driver NVIDIA proprietário ou open (testado com 615.78.08); sessão iniciada pelo systemd do usuário (niri-session lê ~/.config/environment.d)."
when = "Só quando o cache atual está perto do limite. Neste PC o diagnóstico mediu 995 MB."
conditions = ["gpu.vendor=nvidia", "nvidia.glcache_mb>=800"]
change = "Cria ~/.config/environment.d/90-prumo-nvidia-shader-cache.conf com __GL_SHADER_DISK_CACHE_SIZE={{bytes}}. O README da NVIDIA recomenda definir a variável globalmente, porque programas abertos sem ela voltam ao tamanho padrão e podem apagar o excesso."
benefit = "Menos recompilação de shaders já vistos depois que o cache enche. Não muda FPS médio; o efeito esperado, se houver, é em engasgos pontuais. Não medido neste PC."
side_effects = "Usa mais espaço em disco (até o limite escolhido). Nenhum efeito em segurança."
undo = "Desfazer a ação remove o arquivo; reabra a sessão. Manual: apague o arquivo citado."
validation = "Após reabrir a sessão: `systemctl --user show-environment | grep __GL_SHADER` e, com o jogo aberto, `tr '\\0' '\\n' < /proc/$(pgrep -n java)/environ | grep __GL_SHADER`. Acompanhe `du -sh ~/.cache/nvidia/GLCache` passar de ~1 GB."
[action.params.bytes]
default = "10737418240"
description = "Limite em bytes (4 GiB ou 10 GiB)"
allowed = "enum:4294967296|10737418240"
[[action.sources]]
title = "NVIDIA Linux driver README, seção Shader Disk Cache (arquivo local /usr/share/doc/nvidia/README, 615.78.08)"
url = "file:///usr/share/doc/nvidia/README"
consulted = "2026-11-01"
says = "__GL_SHADER_DISK_CACHE_SIZE (integer) configura o tamanho; 'To increase the cache size globally, __GL_SHADER_DISK_CACHE_SIZE can be set in e.g. ~/.bashrc or ~/.profile'; apps sem a variável revertem ao tamanho padrão e o cache é apagado se passar dele."
[[action.steps]]
kind = "write_file"
path = "{{config}}/environment.d/90-prumo-nvidia-shader-cache.conf"
content = "# Criado pelo Prumo (linux.nvidia.glcache-tamanho v1). Remova para desfazer.\n__GL_SHADER_DISK_CACHE_SIZE={{bytes}}\n"

[[action]]
id = "linux.minecraft.gtnh-jvm-oficial"
version = 1
title = "GTNH: memória e argumento JVM conforme o wiki oficial"
platform = "linux"
area = "Minecraft"
tier = "recommended"
evidence = "official_doc"
privilege = "user"
restart = "app"
problem = "As instâncias GTNH herdam o padrão global do Prism (512 MB mínimo / 14096 MB máximo). O wiki do GTNH recomenda mínimo = máximo e 4–6 GB para single player com 16 de distância, e informa um argumento que reduz uso de memória no Java 25+."
compat = "GTNH 2.8+ com Java 25+ (versão lwjgl3ify, Minecraft 1.7.10) no Prism Launcher. Não se aplica a MEGA nem a outros packs 1.7.10."
when = "Instâncias GTNH com Java 25 ou mais novo. Bases muito grandes podem precisar de mais memória: ajuste o parâmetro e observe o uso de heap (F3)."
conditions = []
change = "No instance.cfg de cada instância GTNH selecionada: OverrideMemory=true, MinMemAlloc={{heap_mb}}, MaxMemAlloc={{heap_mb}}, OverrideJavaArgs=true, JvmArgs=-XX:+UseCompactObjectHeaders. O valor anterior de cada chave fica no diário da sessão."
benefit = "Segue a configuração recomendada pelos mantenedores. O wiki afirma menor uso de memória no Java 25+; não há medição de FPS ou frame time publicada nem medida neste PC."
side_effects = "Se a base exigir mais que o valor escolhido, o jogo pode ficar lento por coleta de lixo frequente ou fechar por falta de memória. Substitui argumentos JVM próprios da instância (o valor antigo aparece na prévia e é restaurado ao desfazer)."
undo = "Desfazer a ação/sessão restaura cada chave do instance.cfg. Manual: no Prism, Editar instância → Configurações → Java, desmarque Memória e Argumentos."
validation = "Abra a instância e confira no log do Prism a linha de comando (-Xms/-Xmx e -XX:+UseCompactObjectHeaders). No jogo, F3 mostra o heap; jogue a mesma base por 10 min sem fechar por memória."
[action.params.heap_mb]
default = "6144"
description = "Memória mínima = máxima em MB (wiki: 4–6 GB para single player)"
allowed = "int:4096:12288"
[[action.sources]]
title = "GTNH Wiki — Installing and Migrating"
url = "https://wiki.gtnewhorizons.com/wiki/Installing_and_Migrating"
consulted = "2026-11-01"
says = "'4-6 GB of memory (min-max RAM) is recommended for Single Player (SP) on 16 render distance'; 'Assign the total memory allocation for both minimum and maximum'; 'Specifically for Java 25+, you can add -XX:+UseCompactObjectHeaders under JVM Arguments to reduce memory usage'; Prism 'does not require any additional Java arguments'."
[[action.steps]]
kind = "prism_instance"
[action.steps.selector]
minecraft = "1.7.10"
requires_component = "lwjgl3ify"
name_contains_any = ["GTNH", "New_Horizons", "New Horizons", "RC-2"]
min_java = 25
[action.steps.keys]
OverrideMemory = "true"
MinMemAlloc = "{{heap_mb}}"
MaxMemAlloc = "{{heap_mb}}"
OverrideJavaArgs = "true"
JvmArgs = "-XX:+UseCompactObjectHeaders"

[[action]]
id = "linux.minecraft.gtl-heap-fixo"
version = 1
title = "GTL: memória mínima igual à máxima (experimental)"
platform = "linux"
area = "Minecraft"
tier = "advanced"
evidence = "hypothesis"
privilege = "user"
restart = "app"
problem = "As instâncias GTL iniciam com 512 MB e crescem até ~14 GB. Hipótese: fixar o heap evita redimensionamentos durante o jogo."
compat = "GregTech Leisure Enhanced 2.9.2 (Minecraft 1.20.1, Forge 47.4.16, Java 21 do sistema) no Prism Launcher — a instância que você joga. A página oficial do GTL não informa Java, memória nem argumentos recomendados."
when = "Só para teste comparativo com medição antes/depois (mesma base, mesmo trajeto, com e sem OBS)."
conditions = []
change = "No instance.cfg da instância GregTech-Leisure-Enhanced-2.9.2: OverrideMemory=true, MinMemAlloc={{heap_mb}}, MaxMemAlloc={{heap_mb}}."
benefit = "Desconhecido. Sem fonte do modpack; só vale manter se a medição mostrar menos picos de frame time fora do ruído."
side_effects = "Reserva a memória inteira desde a abertura, o que reduz a RAM livre para OBS e navegador. Com 32 GB e outros Java abertos, pode aumentar o swap."
undo = "Desfazer restaura as chaves do instance.cfg."
validation = "Comparação A/B com o relatório de frame time (etapa de medição)."
[action.params.heap_mb]
default = "12288"
description = "Memória mínima = máxima em MB"
allowed = "int:6144:16384"
[[action.sources]]
title = "CurseForge — GregTech Leisure (página do projeto e arquivo 1.4.5.4)"
url = "https://www.curseforge.com/minecraft/modpacks/gregtech-leisure"
consulted = "2026-11-01"
says = "Não informa Java, RAM, argumentos JVM nem orientação de shaders; por isso a ação é hipótese."
[[action.steps]]
kind = "prism_instance"
[action.steps.selector]
minecraft = "1.20.1"
name_contains_any = ["Enhanced"]
[action.steps.keys]
OverrideMemory = "true"
MinMemAlloc = "{{heap_mb}}"
MaxMemAlloc = "{{heap_mb}}"

[[action]]
id = "linux.memoria.processos-em-segundo-plano"
version = 1
title = "Pressão de memória antes de jogar (orientação)"
platform = "linux"
area = "Diagnóstico"
tier = "manual"
evidence = "hypothesis"
privilege = "user"
restart = "none"
problem = "O diagnóstico encontrou vários GB em swap (zram) com o jogo, OBS, navegador e outros processos Java abertos. Páginas em swap voltam para a RAM quando usadas, o que pode causar pausas."
compat = "Qualquer Linux."
when = "Quando o achado 'memoria.swap-alto' aparecer."
change = "Nenhuma alteração automática. O app lista os maiores consumidores e você decide o que fechar; nada é encerrado pelo app (pode haver trabalho não salvo)."
benefit = "Reduzir swap durante o jogo pode reduzir pausas; precisa de medição (frame time com e sem os processos)."
side_effects = "Nenhum (só orientação)."
undo = "Não se aplica."
validation = "Compare `free -m` e o relatório de frame time com e sem os processos em segundo plano."
[[action.sources]]
title = "Linux kernel — PSI (Pressure Stall Information)"
url = "https://docs.kernel.org/accounting/psi.html"
consulted = "2026-11-01"
says = "PSI mede o tempo em que tarefas ficam paradas esperando memória, I/O ou CPU; usado aqui só para descrever o estado."

[[action]]
id = "linux.obs.perfil-live-1080p60"
version = 1
title = "OBS: perfil novo para live 1080p60 no YouTube com bitrate pelo upload medido"
platform = "linux"
area = "OBS"
tier = "recommended"
evidence = "official_doc"
privilege = "user"
restart = "app"
problem = "O perfil atual ('Sem nome') transmite 1920×1080 a 60 FPS com NVENC H.264 CBR, mas não define bitrate (o OBS usa o padrão do encoder, abaixo do mínimo do YouTube para 1080p60). Bitrate acima do upload real causa quadros perdidos por rede."
compat = "OBS 32 com NVENC (RTX 3060 Ti: H.264/HEVC). Só live (sem gravação simultânea), como você definiu."
when = "Depois de medir o upload com `prumo rede`. O bitrate sugerido é no máximo 70% do menor upload medido, dentro da faixa do YouTube (6–17 Mbps)."
conditions = ["net.upload_mbps>=9"]
change = "Cria o perfil 'Prumo Live 1080p60' em ~/.config/obs-studio/basic/profiles/Prumo_Live_1080p60/: copia basic.ini e service.json do perfil atual (a chave de transmissão é copiada byte a byte, sem ser exibida nem gravada no diário ou nos backups do app), define saída Avançada, 1920×1080, 60 FPS, NVENC H.264 e escreve streamEncoder.json com CBR {{bitrate}} kbps, keyframe 2 s, preset {{preset}}, 2 B-frames. O perfil 'Sem nome' não é alterado."
benefit = "Bitrate dentro da faixa do YouTube e abaixo da capacidade de upload medida: menos quadros perdidos por rede e imagem mais limpa que com o padrão do encoder. Não muda o FPS do jogo."
side_effects = "Mais bitrate usa mais upload; se a conexão oscilar abaixo do medido, haverá quadros perdidos. Preset mais alto usa mais o encoder da GPU."
undo = "Desfazer apaga os arquivos do perfil novo (se você não os alterou depois). O perfil 'Sem nome' continua intacto. Manual: no OBS, Perfil → remover 'Prumo Live 1080p60'."
validation = "No OBS: Perfil → 'Prumo Live 1080p60'. Faça uma live não listada de 10 min jogando GTL e veja em Estatísticas: quadros perdidos por rede, atraso de renderização e atraso de codificação perto de 0%."
[action.params.bitrate]
default = "fact:obs.suggested_bitrate_kbps"
description = "Bitrate de vídeo em kbps (padrão: calculado do upload medido)"
allowed = "int:6000:17000"
[action.params.preset]
default = "p6"
description = "Preset NVENC (p6 é o que seu perfil atual usa)"
allowed = "enum:p4|p5|p6|p7"
[[action.sources]]
title = "YouTube Help — Choose live encoder settings, bitrates, and resolutions"
url = "https://support.google.com/youtube/answer/2853702"
consulted = "2026-11-01"
says = "1080p @60fps: H.264 mínimo 6 Mbps, recomendado 17 Mbps; AV1/H.265 mínimo 4, recomendado 12. Keyframe recomendado 2 s; CBR; '2 B-Frames, 1 Reference Frame'."
[[action.sources]]
title = "NVIDIA Video Encode and Decode GPU Support Matrix"
url = "https://developer.nvidia.com/video-encode-and-decode-gpu-support-matrix-new"
consulted = "2026-11-01"
says = "RTX 3060 Ti: 1 NVENC, H.264 e HEVC sim, AV1 não."
[[action.steps]]
kind = "copy_if_missing"
from = "{{config}}/obs-studio/basic/profiles/Sem_nome/basic.ini"
to = "{{config}}/obs-studio/basic/profiles/Prumo_Live_1080p60/basic.ini"
[[action.steps]]
kind = "copy_if_missing"
from = "{{config}}/obs-studio/basic/profiles/Sem_nome/service.json"
to = "{{config}}/obs-studio/basic/profiles/Prumo_Live_1080p60/service.json"
[[action.steps]]
kind = "ini_set"
path = "{{config}}/obs-studio/basic/profiles/Prumo_Live_1080p60/basic.ini"
section = "General"
key = "Name"
value = "Prumo Live 1080p60"
[[action.steps]]
kind = "ini_set"
path = "{{config}}/obs-studio/basic/profiles/Prumo_Live_1080p60/basic.ini"
section = "Output"
key = "Mode"
value = "Advanced"
[[action.steps]]
kind = "ini_set"
path = "{{config}}/obs-studio/basic/profiles/Prumo_Live_1080p60/basic.ini"
section = "AdvOut"
key = "Encoder"
value = "obs_nvenc_h264_tex"
[[action.steps]]
kind = "ini_set"
path = "{{config}}/obs-studio/basic/profiles/Prumo_Live_1080p60/basic.ini"
section = "Video"
key = "OutputCX"
value = "1920"
[[action.steps]]
kind = "ini_set"
path = "{{config}}/obs-studio/basic/profiles/Prumo_Live_1080p60/basic.ini"
section = "Video"
key = "OutputCY"
value = "1080"
[[action.steps]]
kind = "ini_set"
path = "{{config}}/obs-studio/basic/profiles/Prumo_Live_1080p60/basic.ini"
section = "Video"
key = "FPSType"
value = "0"
[[action.steps]]
kind = "ini_set"
path = "{{config}}/obs-studio/basic/profiles/Prumo_Live_1080p60/basic.ini"
section = "Video"
key = "FPSCommon"
value = "60"
[[action.steps]]
kind = "write_file"
path = "{{config}}/obs-studio/basic/profiles/Prumo_Live_1080p60/streamEncoder.json"
content = "{\"rate_control\":\"CBR\",\"bitrate\":{{bitrate}},\"keyint_sec\":2,\"preset\":\"{{preset}}\",\"profile\":\"high\",\"bf\":2,\"lookahead\":false}\n"

[[action]]
id = "linux.monitor.vrr-displayport"
version = 1
title = "Monitor pela DisplayPort para ativar VRR (G-SYNC Compatible)"
platform = "linux"
area = "Monitor"
tier = "manual"
evidence = "official_doc"
privilege = "user"
restart = "logout"
problem = "Com taxa fixa de 165 Hz e FPS abaixo disso (comum no GTNH/GTL e na live a 60), quadros ficam com tempos de exibição desiguais (judder) ou com tearing. O EDID do seu monitor anuncia faixa de 48–165 Hz e FreeSync, mas pela HDMI o driver NVIDIA só aceita o VRR do HDMI 2.1, que o monitor não anuncia."
compat = "RTX 3060 Ti (Ampere) + driver 615.78; Niri 26.04; cabo DisplayPort ligado a uma das saídas DP da placa (DP-1/2/3)."
when = "Quando o FPS dos jogos fica abaixo de 165 Hz em boa parte do tempo."
change = "Manual: trocar o cabo para DisplayPort; em ~/.config/niri/cfg/display.kdl criar `output \"DP-1\" { mode \"1920x1080@165\"; variable-refresh-rate }` (ou `variable-refresh-rate on-demand=true` com regra de janela para o jogo). No Windows, ativar G-SYNC no Painel de Controle NVIDIA."
benefit = "O monitor passa a exibir cada quadro assim que fica pronto dentro de 48–165 Hz, o que remove judder e tearing causados pela diferença entre FPS e taxa fixa. Não aumenta o FPS. Não medido neste PC."
side_effects = "Monitores não validados como G-SYNC Compatible podem piscar perto de 48 Hz (telas de carregamento). Se piscar, use on-demand ou limite mínimo (VRRMinRefreshRate no driver)."
undo = "Voltar o cabo para HDMI ou remover `variable-refresh-rate` do display.kdl."
validation = "`niri msg outputs` mostra 'Variable refresh rate: supported, enabled'. Frame time no GTNH com e sem VRR (etapa de medição)."
[[action.sources]]
title = "NVIDIA Linux driver README 615.78 (local), opção AllowGSYNCCompatible"
url = "file:///usr/share/doc/nvidia/README"
consulted = "2026-11-01"
says = "'G-SYNC Compatible monitors are supported via DisplayPort on Pascal and newer GPUs, and via HDMI on Turing and newer GPUs'; monitores não validados têm o modo desligado por padrão e podem ser forçados com AllowGSYNCCompatible=On."
[[action.sources]]
title = "EDID do monitor lido com edid-decode (HDMI-A-1)"
url = "file:///sys/class/drm/card1-HDMI-A-1/edid"
consulted = "2026-11-01"
says = "'Monitor ranges (GTF): 48-165 Hz V'; 'Vendor-Specific Data Block (AMD)' com 'Maximum Refresh Rate: 165 Hz'; bloco HDMI Forum sem campos VRRmin/VRRmax."
[[action.sources]]
title = "niri wiki — Configuration: Outputs"
url = "https://github.com/YaLTeR/niri/wiki/Configuration:-Outputs"
consulted = "2026-11-01"
says = "Página indicada no próprio display.kdl para a opção variable-refresh-rate; confirmar a sintaxe exata na versão 26.04 antes de editar."

